<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stem Flow</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#03050b;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#fff}#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:saturate(.9) contrast(1.08) brightness(.66)}#veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(3,7,17,.44),rgba(3,4,17,.06) 54%,rgba(0,18,21,.35)),radial-gradient(circle at center,transparent 18%,rgba(0,0,0,.42))}
    #mixer{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .55s ease}.mixing #mixer{opacity:1}.zone{position:absolute;display:grid;place-items:center;width:34vw;height:34vw;max-width:420px;max-height:420px;min-width:150px;min-height:150px}.zone:nth-child(1){left:2vw;top:2vw}.zone:nth-child(2){right:2vw;top:2vw}.zone:nth-child(3){left:2vw;bottom:2vw}.zone:nth-child(4){right:2vw;bottom:2vw}
    .orb{--amount:.55;--color:183;width:clamp(112px,calc(10vw + var(--amount)*16vw),345px);aspect-ratio:1;display:grid;place-content:center;border-radius:50%;background:transparent;border:1px solid hsl(var(--color) 100% 91% / calc(.23 + var(--amount)*.5));box-shadow:0 0 calc(9px + var(--amount)*38px) hsl(var(--color) 100% 70% / calc(.12 + var(--amount)*.35)),inset 0 0 calc(5px + var(--amount)*20px) hsl(var(--color) 100% 88% / calc(.03 + var(--amount)*.17));transition:width 150ms ease-out,border-color 150ms ease-out,box-shadow 150ms ease-out}.orb:before{content:'';position:absolute;inset:12%;border-radius:inherit;border:1px solid hsl(var(--color) 100% 95%/.13)}.orb h2{margin:0;font-size:clamp(14px,2vw,27px);letter-spacing:.2em;text-transform:uppercase;font-weight:650;text-shadow:0 1px 13px #000}.orb p{margin:6px 0 0;text-align:center;font-size:clamp(11px,1.1vw,15px);color:rgba(255,255,255,.76);letter-spacing:.1em}.signal{position:absolute;bottom:15%;font-size:clamp(9px,1vw,16px);font-style:normal;color:hsl(var(--color) 100% 88%/.65);letter-spacing:-2px;animation:pulse 1.2s ease-in-out infinite alternate}@keyframes pulse{to{transform:scaleX(1.6);opacity:.25}}.vocal{--color:288}.drums{--color:185}.bass{--color:37}.others{--color:330}
    #hud{position:fixed;top:24px;left:28px;display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.82);font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 7px #000}.dot{width:7px;height:7px;border-radius:50%;background:#ffbe59;box-shadow:0 0 12px #ffbe59}.live .dot{background:#83ffd3;box-shadow:0 0 12px #83ffd3}#instruction{position:fixed;left:50%;top:50%;width:min(620px,calc(100% - 40px));transform:translate(-50%,-50%);text-align:center;font-size:clamp(18px,3.2vw,46px);font-weight:500;letter-spacing:.06em;line-height:1.15;text-shadow:0 2px 24px #000;transition:opacity .35s}#instruction small{display:block;margin-top:14px;font-size:11px;font-weight:500;letter-spacing:.15em;color:rgba(255,255,255,.7);text-transform:uppercase}.mixing #instruction{opacity:0}.hidden{display:none!important}#launch{position:fixed;inset:0;display:grid;place-items:center;cursor:pointer;background:rgba(1,2,8,.45);z-index:5;transition:opacity .4s}#launch span{padding:15px 22px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px);font-size:12px;letter-spacing:.14em;text-transform:uppercase}#launch.hidden{opacity:0;pointer-events:none}#hint{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 36px);text-align:center;color:rgba(255,255,255,.75);font-size:11px;letter-spacing:.09em;text-shadow:0 1px 6px #000}.mixing #hint{opacity:.65}@media(max-width:600px){.zone{width:45vw;height:45vw}.zone:nth-child(1){left:-2vw;top:1vh}.zone:nth-child(2){right:-2vw;top:1vh}.zone:nth-child(3){left:-2vw;bottom:1vh}.zone:nth-child(4){right:-2vw;bottom:1vh}.orb{width:clamp(95px,calc(15vw + var(--amount)*17vw),210px)}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <video id="camera" autoplay muted playsinline></video><div id="veil"></div>
  <main id="mixer" aria-label="Four transparent stem controls"><div class="zone"><article class="orb vocal" id="vocal"><h2>Vocal</h2><p>55%</p><i class="signal">▂▅▇▅▂</i></article></div><div class="zone"><article class="orb drums" id="drums"><h2>Drums</h2><p>55%</p><i class="signal">▂▅▇▅▂</i></article></div><div class="zone"><article class="orb bass" id="bass"><h2>Bass</h2><p>55%</p><i class="signal">▂▅▇▅▂</i></article></div><div class="zone"><article class="orb others" id="others"><h2>Others</h2><p>55%</p><i class="signal">▂▅▇▅▂</i></article></div></main>
  <div id="hud"><i class="dot"></i><span id="status">Preparing camera</span></div><div id="instruction">Bring both palms together<small>Hold the gesture to begin</small></div><p id="hint">LEFT: vocal ↑ / bass ↓ · RIGHT: drums ↑ / others ↓</p><div id="launch"><span>Tap anywhere to enable camera</span></div>
  <script>
    const names=['vocal','drums','bass','others'], amounts=Object.fromEntries(names.map(n=>[n,.55]));const status=document.getElementById('status'),hud=document.getElementById('hud'),instruction=document.getElementById('instruction'),launch=document.getElementById('launch'),video=document.getElementById('camera');let context,gains,playing=false,phase='join',poseName='',poseSince=0,mergeSince=0,handsWereApart=false,fullMixActive=false,separatedAmounts={...amounts},lastVideoTime=-1,hands;
    function draw(n,v){v=Math.max(.04,Math.min(1,v));amounts[n]=v;const el=document.getElementById(n);el.style.setProperty('--amount',v);el.querySelector('p').textContent=Math.round(v*100)+'%';if(gains?.[n])gains[n].gain.setTargetAtTime(v,context.currentTime,.06)}names.forEach(n=>draw(n,.55));
    let players={};function makeAudio(){context=new AudioContext();gains={};const files={vocal:'vocals',drums:'drums',bass:'bass',others:'other'};for(const [name,file] of Object.entries(files)){const player=new Audio(`assets/demo/${file}.mp3`),gain=context.createGain();player.preload='auto';player.loop=true;gain.gain.value=amounts[name];context.createMediaElementSource(player).connect(gain).connect(context.destination);players[name]=player;gains[name]=gain}}function play(){if(!context)makeAudio();context.resume();Object.values(players).forEach(player=>player.play().catch(()=>{}));playing=true;hud.classList.add('live');status.textContent='Playing · hands control the mix'}function pause(){if(!context)return;Object.values(players).forEach(player=>player.pause());playing=false;hud.classList.remove('live');status.textContent='Paused'}
    function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function open(l){const w=l[0],palm=distance(w,l[9]);return [8,12,16,20].filter(i=>distance(w,l[i])>palm*1.65).length>=3}function gripped(l){const w=l[0],palm=distance(w,l[9]);return [8,12,16,20].filter(i=>distance(w,l[i])<palm*1.42).length>=3}function stable(next,ms){const now=performance.now();if(next!==poseName){poseName=next;poseSince=now;return false}return now-poseSince>=ms}
    function onResults(r){if(!r.multiHandLandmarks||r.multiHandLandmarks.length!==2){poseName='';mergeSince=0;if(phase==='join')instruction.innerHTML='Bring both palms together<small>Show exactly two hands</small>';return}const data=r.multiHandLandmarks.map((landmarks,i)=>({landmarks,label:r.multiHandedness[i].label,open:open(landmarks),gripped:gripped(landmarks),center:landmarks[9]}));const horizontalGap=Math.abs(data[0].center.x-data[1].center.x),verticalGap=Math.abs(data[0].center.y-data[1].center.y),midpoint=(data[0].center.x+data[1].center.x)/2,joined=horizontalGap<.20&&verticalGap<.28,joinedAtCenter=joined&&midpoint>.37&&midpoint<.63;if(phase==='join'){if(joinedAtCenter&&stable('joined',260)){phase='awaitOpen';poseName='';instruction.innerHTML='OPEN YOUR HANDS<br>TO PLAY MUSIC<small>Separate both palms</small>';status.textContent='Ready · open both hands'}else if(!joinedAtCenter){poseName=''}return}const bothOpen=data.every(h=>h.open),bothGripped=data.every(h=>h.gripped);if(phase==='awaitOpen'){if(bothOpen&&!joined&&stable('opening',260)){phase='mix';poseName='';document.body.classList.add('mixing');instruction.setAttribute('aria-hidden','true');play()}else if(!bothOpen||joined){poseName=''}return}if(phase!=='mix')return;if(horizontalGap>.38)handsWereApart=true;if(joinedAtCenter){if(fullMixActive)return;if(handsWereApart){if(!mergeSince)mergeSince=performance.now();if(performance.now()-mergeSince>=600){names.forEach(name=>draw(name,1));fullMixActive=true;handsWereApart=false;play();status.textContent='Full mix · all stems restored'}return}}mergeSince=0;if(fullMixActive){names.forEach(name=>draw(name,separatedAmounts[name]));fullMixActive=false;status.textContent='Separated mix restored'}if(bothGripped){pause();return}play();if(!bothOpen)return;/* The video is mirrored for the performer; MediaPipe labels raw, unmirrored frames, so labels are deliberately swapped here. */const left=data.find(h=>h.label==='Right'),right=data.find(h=>h.label==='Left');if(!left||!right)return;const map=h=>{const y=Math.max(0,Math.min(1,h.center.y)),range=.32;return[Math.max(.04,(.5-y)/range),Math.max(.04,(y-.5)/range)]};const[v,b]=map(left),[d,o]=map(right);separatedAmounts={vocal:v,bass:b,drums:d,others:o};draw('vocal',v);draw('bass',b);draw('drums',d);draw('others',o)}
    async function frame(){if(video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;await hands.send({image:video})}requestAnimationFrame(frame)}
    launch.onclick=async()=>{launch.classList.add('hidden');makeAudio();await context.resume();await Promise.all(Object.values(players).map(player=>player.play().then(()=>player.pause()).catch(()=>{})));try{const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.35,minTrackingConfidence:.35});hands.onResults(onResults);status.textContent='Camera ready · bring palms together';requestAnimationFrame(frame)}catch(e){status.textContent='Camera permission unavailable';instruction.innerHTML='Camera permission is required<small>Reload after allowing camera access</small>'}}
  </script>
</body>
</html>
